name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack ZIP and Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;34.0.0" >/dev/null || true
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descomprimiendo $ZIP_FILE ..."
            unzip -o -q "$ZIP_FILE" -d .
          fi
          # Busca la carpeta que tenga build.sh Y la carpeta res juntas
          PROJECT_DIR=$(find . -type d -exec test -f '{}/build.sh' -a -d '{}/res' \; -print | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          echo "Compilando en directorio: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          BUILD_TOOLS=34.0.0 sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CleanLauncher-Clio2-APK
          path: "**/build/CleanLauncher.apk"
          if-no-files-found: error
