name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack ZIP and Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;34.0.0" >/dev/null || true
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descomprimiendo $ZIP_FILE ..."
            unzip -o -q "$ZIP_FILE" -d .
          fi
          BUILD_PATH=$(find . -name "build.sh" | head -n 1)
          cd "$(dirname "$BUILD_PATH")"
          BUILD_TOOLS=34.0.0 sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CleanLauncher-Clio2-APK
          path: "**/build/CleanLauncher.apk"
          if-no-files-found: error
